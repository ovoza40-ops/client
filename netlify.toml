[build]
  command = "cd client && npm install && npm run build"
  publish = "client/.next"

[context.production.environment]
  NODE_ENV = "production"

# Environment variables to set in Netlify dashboard
# NEXT_PUBLIC_SUPABASE_URL
# NEXT_PUBLIC_SUPABASE_ANON_KEY
# OPENAI_API_KEY
# NEXT_PUBLIC_APP_URL

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
